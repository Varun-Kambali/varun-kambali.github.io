name: sync

# Daily: pull each project's status, release, demo and headline eval into the site.
# Opens a pull request and merges it only when something changed.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sync project cards
        run: node scripts/sync.mjs --site index.html --report "$RUNNER_TEMP/sync-report.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the result before it can merge
        run: |
          python3 scripts/check_site.py
          python3 scripts/check_public_text.py index.html "$RUNNER_TEMP/sync-report.md"
          node --test "tests/*.test.js"

      - name: Open and merge a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          branch="sync/projects-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: sync project cards from GitHub"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: sync project cards from GitHub" --body-file "$RUNNER_TEMP/sync-report.md"
          gh pr merge "$branch" --merge --delete-branch
          # Merges made with this token don't always start a Pages build, so ask for one.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
