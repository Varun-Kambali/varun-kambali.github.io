name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Evidence map and public-safety checks
        run: python3 scripts/check_site.py

      - name: Unit tests (eval summary parser)
        run: node --test "tests/*.test.js"

      - name: HTML validation
        run: npx --yes html-validate@11.16.4 "*.html"

      - name: Accessibility, WCAG 2 AA (pa11y-ci with axe and HTML_CodeSniffer)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          npx --yes pa11y-ci@5.0.0 --config .pa11yci.json

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scan the whole history with the CLI. The action derives a commit range from
      # the push event, and on a branch's first push that range starts before the
      # root commit, so git errors out. The repo is small, so a full scan is cheap.
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .
